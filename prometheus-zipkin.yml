global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus сам себя
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Zipkin
  - job_name: 'zipkin'
    static_configs:
      - targets: ['zipkin:9411']
    metrics_path: /metrics
    scrape_interval: 15s

  # Spring Boot приложение
  - job_name: 'spring-boot-app'
    static_configs:
      - targets: ['spring-app-zipkin:8080']
    metrics_path: /actuator/prometheus
    scrape_interval: 15s

  # Kafka
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9101']
    metrics_path: /metrics
    scrape_interval: 15s

  # Kafka UI
  - job_name: 'kafka-ui'
    static_configs:
      - targets: ['kafka-ui-zipkin:8080']
    metrics_path: /metrics
    scrape_interval: 15s