spring:
  application:
    name: spring-app-consul
  
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        register: true
        health-check-interval: 10s
        health-check-timeout: 5s
        health-check-critical-timeout: 30s
        health-check-path: /actuator/health
        health-check-tls-skip-verify: true
        instance-id: ${spring.application.name}-${random.uuid}
        service-name: ${spring.application.name}
        tags:
          - version=1.0
          - environment=production
        metadata:
          management.context-path: /actuator
          management.port: 8080
      config:
        enabled: true
        format: YAML
        data-key: configuration
        default-context: application
        profile-separator: '::'

  # RabbitMQ конфигурация
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 10000
    requested-heartbeat: 30
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3
        max-interval: 10000
        multiplier: 2
    listener:
      simple:
        auto-startup: true
        concurrency: 2
        max-concurrency: 10
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          max-interval: 10000
          multiplier: 2

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,shutdown,consul
  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: true
  health:
    rabbit:
      enabled: true
    consul:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# Server конфигурация
server:
  shutdown: graceful
  tomcat:
    connection-timeout: 20000
    max-connections: 8192
    accept-count: 100
    max-threads: 200
    min-spare-threads: 10

# Logging
logging:
  level:
    com.example.rabbitmq: DEBUG
    org.springframework.cloud.consul: DEBUG
    org.springframework.amqp: DEBUG
    org.springframework.rabbit: DEBUG
    org.springframework.boot.actuate: DEBUG