spring:
  application:
    name: integrated-two-level-cache-demo
  
  # Redis Configuration (совместимо с существующим RedisService)
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # Cache Configuration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m,recordStats

# TTL для Redis (совместимо с существующим RedisService)
ttl:
  redis: 3600 # 1 час в секундах

# Custom cache configuration
cache:
  caffeine:
    spec: maximumSize=1000,expireAfterWrite=5m,recordStats
  redis:
    default-ttl: 3600000 # 1 час в миллисекундах
    key-prefix: "ClientAml " # Используем тот же префикс что и в RedisService
    use-key-prefix: true

# Logging
logging:
  level:
    com.example.cache: DEBUG
    kg.ssm.service.redis: DEBUG
    org.springframework.cache: DEBUG