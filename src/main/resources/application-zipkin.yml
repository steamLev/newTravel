spring:
  application:
    name: spring-app-zipkin
  
  # Zipkin конфигурация
  zipkin:
    base-url: http://localhost:9411
    sender:
      type: kafka
    kafka:
      topic: zipkin
  
  # Micrometer Tracing конфигурация
  tracing:
    zipkin:
      endpoint: http://localhost:9411/api/v2/spans
    sampling:
      probability: 1.0  # 100% трассировка для разработки

  # Kafka конфигурация
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # Включаем трассировку для Kafka
        interceptor.classes: brave.kafka.interceptor.TracingProducerInterceptor
    consumer:
      group-id: spring-app-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # Включаем трассировку для Kafka
        interceptor.classes: brave.kafka.interceptor.TracingConsumerInterceptor
    properties:
      # Brave трассировка для Kafka
      interceptor.classes: brave.kafka.interceptor.TracingProducerInterceptor,brave.kafka.interceptor.TracingConsumerInterceptor

  # Spring Cloud Stream конфигурация
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
          zk-nodes: localhost:2181
        bindings:
          # Producer binding
          output:
            producer:
              use-native-encoding: true
          # Consumer binding
          input:
            consumer:
              use-native-decoding: true
      bindings:
        # Producer
        output:
          destination: messages-topic
          content-type: application/json
        # Consumer
        input:
          destination: messages-topic
          content-type: application/json
          group: spring-app-group

  # RabbitMQ конфигурация (с трассировкой)
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 10000
    requested-heartbeat: 30
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3
        max-interval: 10000
        multiplier: 2
    listener:
      simple:
        auto-startup: true
        concurrency: 2
        max-concurrency: 10
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          max-interval: 10000
          multiplier: 2

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,zipkin
  endpoint:
    health:
      show-details: always
    zipkin:
      enabled: true
  health:
    rabbit:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

# Logging для трассировки
logging:
  level:
    com.example.rabbitmq: DEBUG
    org.springframework.cloud.sleuth: DEBUG
    brave: DEBUG
    zipkin2: DEBUG
    org.springframework.kafka: DEBUG
    org.springframework.amqp: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"