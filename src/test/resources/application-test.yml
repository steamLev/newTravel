spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 5000
    requested-heartbeat: 30

rabbitmq:
  channel:
    max-available: 5
    check-interval: 1000
  queue:
    name: test.message.queue
    durable: true
    auto-delete: true
  exchange:
    name: test.message.exchange
    type: direct
    durable: true

message:
  delivery:
    delay-seconds: 1
    max-attempts: 3

logging:
  level:
    com.example.rabbitmq: DEBUG
    org.springframework.amqp: DEBUG